<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTNHMapSlim 存档精简</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <div class="banner hidden" id="banner"></div>

  <header class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l1.6 2h9.2A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7.5 14.2h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>GTNHMapSlim</h1>
        <p class="sub">删除加载时长不足阈值的区块，回收存档体积</p>
      </div>
    </div>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>1. 选择存档目录</h2>
      <span class="tag" id="root-tag">未选择</span>
    </div>

    <div class="dropzone" id="dropzone">
      <svg class="dz-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M6 14a4 4 0 0 1 4-4h10l4 5h14a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V14Z"
              stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M24 33V22m0 0-5 5m5-5 5 5" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="dz-title">把存档文件夹拖到这里</p>
      <p class="dz-note" id="dz-note">自动读取完整路径</p>
    </div>

    <div class="picker">
      <svg class="picker-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l1.6 2h9.2A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <input type="text" id="path-input" spellcheck="false" autocomplete="off"
             placeholder="输入或粘贴目录路径，例如 D:\gtnh\gtnh3\server\World">
      <button type="button" class="btn ghost" id="btn-pick">浏览…</button>
      <button type="button" class="btn solid" id="btn-load">载入</button>
    </div>

    <div class="hint" id="pick-hint"></div>
    <div class="candidates" id="candidates"></div>
  </section>

  <section class="card hidden" id="worlds-card">
    <div class="card-head">
      <h2>2. 世界列表</h2>
      <div class="card-actions">
        <button type="button" class="link" id="btn-all">全选</button>
        <span class="sep">/</span>
        <button type="button" class="link" id="btn-none">全不选</button>
      </div>
    </div>
    <p class="list-note">私人维度（家园）、空间站、母舰与技术维度默认不勾选，可按需手动勾选。</p>
    <div class="worlds" id="worlds"></div>
    <div class="worlds-foot" id="worlds-foot"></div>
  </section>

  <section class="card hidden" id="options-card">
    <div class="card-head"><h2>3. 参数</h2></div>

    <div class="opts">
      <label class="field">
        <span class="label">加载时长阈值</span>
        <span class="inline">
          <input type="number" id="minutes" value="15" min="0.5" step="0.5">
          <span class="unit">分钟</span>
        </span>
        <span class="field-note" id="ticks-note">低于该时长的区块会被删除</span>
      </label>

      <div class="field">
        <span class="label">写入方式</span>
        <div class="modes">
          <label class="mode">
            <input type="radio" name="mode" value="compact" checked>
            <span class="mode-body">
              <b>压实重写</b>
              <em>删除后重写文件，磁盘空间真正释放</em>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="fast">
            <span class="mode-body">
              <b>快速打补丁</b>
              <em>只改文件头，秒级生效，不回收空间</em>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="compact-only">
            <span class="mode-body">
              <b>仅压实</b>
              <em>不删区块，只回收空洞扇区</em>
            </span>
          </label>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="backup" checked>
        <span>执行前备份受影响的 region 文件</span>
      </label>
      <div class="hint" id="backup-hint"></div>
    </div>
  </section>

  <section class="actions hidden" id="actions">
    <div class="volume" id="volume-before"></div>
    <button type="button" class="btn primary" id="btn-run">精简</button>
    <p class="warn">执行后这些区块会回到未生成状态，重新进入游戏时地形会重新生成，原有的建筑、机器与箱子不再保留。</p>
  </section>

  <section class="card progress-card hidden" id="progress-card">
    <div class="prog-head">
      <div>
        <span class="prog-state" id="prog-state">执行中</span>
        <span class="prog-percent" id="prog-percent">0%</span>
      </div>
      <button type="button" class="btn ghost danger" id="btn-cancel">取消</button>
    </div>

    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>

    <div class="stats">
      <div class="stat"><span class="k">文件</span><span class="v" id="st-files">0 / 0</span></div>
      <div class="stat"><span class="k">已删除区块</span><span class="v" id="st-deleted">0</span></div>
      <div class="stat"><span class="k">已回收</span><span class="v" id="st-freed">0 B</span></div>
      <div class="stat"><span class="k">速度</span><span class="v" id="st-speed">-</span></div>
      <div class="stat"><span class="k">剩余</span><span class="v" id="st-eta">-</span></div>
    </div>

    <div class="current" id="current"></div>
    <div class="report hidden" id="report"></div>
    <div class="result" id="result"></div>
  </section>

</div>
<script>window.APP_CONFIG = __APP_CONFIG__;</script>
<script src="/app.js"></script>
</body>
</html>
